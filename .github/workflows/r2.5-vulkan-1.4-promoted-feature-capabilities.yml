name: NYAMIST G925 R2.5 Vulkan 1.4 Promoted-Feature Capability Audit

on:
  push:
    branches:
      - feature/g925-r2.5-promoted-feature-capability-audit
  pull_request:
    branches:
      - feature/g925-r2.3-vulkan-1.4-driver-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-r2-5:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch pinned Khronos Vulkan-Headers v1.4.368
        run: |
          git clone --depth 1 --branch v1.4.368 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          grep -q "VK_HEADER_VERSION 368" "$RUNNER_TEMP/Vulkan-Headers/include/vulkan/vulkan_core.h"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK, NDK, CMake and GLSL compiler
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install --yes glslang-tools

      - name: Install Gradle 9.6.0
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-9.6.0-bin.zip \
            --output "$RUNNER_TEMP/gradle-9.6.0-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.6.0-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Validate R2.2 through R2.5 contract tests
        run: |
          python3 -m unittest \
            tools.tests.test_r2_2_swapchain_recovery_contract \
            tools.tests.test_r2_3_vulkan_1_4_driver_audit \
            tools.tests.test_r2_4_vulkan_1_4_promoted_extensions \
            tools.tests.test_r2_5_vulkan_1_4_promoted_feature_capabilities -v

      - name: Build arm64 Android APK
        working-directory: android/surface-validation
        run: NYAMIST_VULKAN_HEADERS_ROOT="$RUNNER_TEMP/Vulkan-Headers" gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload R2.5 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nyamist-g925-r2.5-vulkan-1.4-feature-capability-audit-apk
          path: android/surface-validation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
