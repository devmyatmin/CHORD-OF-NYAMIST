name: NYAMIST Core CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches:
      - main
      - feature/g925-r2.0-pixel-readback-verification
      - feature/g925-r2.1-surface-lifecycle-swapchain-recreation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Vulkan headers and loader development package
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Python importer tests
        run: PYTHONPATH=tools python3 -m unittest discover -s tools/tests -v

      - name: Shell syntax check
        run: bash -n tools/termux-probe.sh tools/termux-build-core.sh tools/export-device-probe.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNYAMIST_BUILD_TESTS=ON -DNYAMIST_BUILD_BENCHMARKS=ON -DNYAMIST_ENABLE_VULKAN_DISCOVERY=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Configure runtime Vulkan dispatch variant
        run: |
          cmake -S . -B build-dynamic -DCMAKE_BUILD_TYPE=Release -DNYAMIST_BUILD_TESTS=ON -DNYAMIST_ENABLE_VULKAN_DISCOVERY=ON -DNYAMIST_FORCE_VULKAN_DYNAMIC_LOADING=ON

      - name: Build runtime Vulkan dispatch variant
        run: cmake --build build-dynamic --parallel 2

      - name: Test runtime Vulkan dispatch variant
        run: ctest --test-dir build-dynamic --output-on-failure

      - name: R1.2 logical-device and queue validation report smoke test
        run: |
          set +e
          ./build-dynamic/nyamist-cli validate-device --output ./build-dynamic/nyamist-r1.2-device-validation.json
          probe_exit=$?
          set -e
          if [ "$probe_exit" -gt 1 ]; then
            echo "R1.2 probe returned an unexpected CLI exit code: $probe_exit"
            exit "$probe_exit"
          fi
          python3 -m json.tool ./build-dynamic/nyamist-r1.2-device-validation.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("./build-dynamic/nyamist-r1.2-device-validation.json").read_text())
          assert report["schema_version"] == 1
          assert report["status"] in {"success", "failed", "unavailable"}
          assert report["logical_device"]["enabled_device_extension_count"] == 0
          assert report["logical_device"]["enabled_core_features"] == "none"
          if report["status"] == "success":
              assert report["logical_device"]["create_status"] == "success"
              assert report["queue_retrieval"]["status"] == "success"
              assert report["queue_retrieval"]["queue_handle_non_null"] is True
              assert report["cleanup"]["logical_device_destroyed"] is True
          print("R1.2 report contract is valid:", report["status"])
          PY

      - name: R1.3 command-submission and fence validation report smoke test
        run: |
          set +e
          ./build-dynamic/nyamist-cli validate-submit --output ./build-dynamic/nyamist-r1.3-command-submission.json
          probe_exit=$?
          set -e
          if [ "$probe_exit" -gt 1 ]; then
            echo "R1.3 probe returned an unexpected CLI exit code: $probe_exit"
            exit "$probe_exit"
          fi
          python3 -m json.tool ./build-dynamic/nyamist-r1.3-command-submission.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("./build-dynamic/nyamist-r1.3-command-submission.json").read_text())
          assert report["schema_version"] == 1
          assert report["status"] in {"success", "failed", "unavailable"}
          assert report["physical_device"]["query_status"] in {"success", "failed", "not_attempted"}
          assert report["queue_submission"]["status"] in {"success", "failed", "not_attempted"}
          assert report["fence"]["wait_status"] in {"success", "failed", "not_attempted"}
          assert isinstance(report["device_lost"], bool)
          if report["status"] == "success":
              assert report["queue_submission"]["submitted"] is True
              assert report["fence"]["wait_status"] == "success"
              assert report["fence"]["status_query"] == "success"
              assert report["fence"]["signaled"] is True
              assert report["device_lost"] is False
              assert report["cleanup"]["fence_destroyed"] is True
              assert report["cleanup"]["command_buffer_freed"] is True
              assert report["cleanup"]["command_pool_destroyed"] is True
              assert report["cleanup"]["logical_device_destroyed"] is True
              assert report["cleanup"]["instance_destroyed"] is True
          print("R1.3 report contract is valid:", report["status"])
          PY

      - name: R1.4 GPU resource-transfer validation report smoke test
        run: |
          set +e
          ./build-dynamic/nyamist-cli validate-transfer --output ./build-dynamic/nyamist-r1.4-gpu-resource-transfer.json
          probe_exit=$?
          set -e
          if [ "$probe_exit" -gt 1 ]; then
            echo "R1.4 probe returned an unexpected CLI exit code: $probe_exit"
            exit "$probe_exit"
          fi
          python3 -m json.tool ./build-dynamic/nyamist-r1.4-gpu-resource-transfer.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("./build-dynamic/nyamist-r1.4-gpu-resource-transfer.json").read_text())
          assert report["schema_version"] == 1
          assert report["status"] in {"success", "failed", "unavailable"}
          assert report["buffers"]["size_bytes"] == 4096
          assert report["command"]["submit_status"] in {"success", "failed", "not_attempted"}
          assert report["readback"]["status"] in {"success", "mismatch", "failed", "not_attempted"}
          assert isinstance(report["device_lost"], bool)
          if report["status"] == "success":
              assert report["buffers"]["source_create_status"] == "success"
              assert report["buffers"]["destination_create_status"] == "success"
              assert report["memory"]["source_allocate_status"] == "success"
              assert report["memory"]["destination_allocate_status"] == "success"
              assert report["memory"]["source_bind_status"] == "success"
              assert report["memory"]["destination_bind_status"] == "success"
              assert report["command"]["host_to_transfer_barrier_recorded"] is True
              assert report["command"]["transfer_to_host_barrier_recorded"] is True
              assert report["command"]["submitted"] is True
              assert report["command"]["fence_signaled"] is True
              assert report["readback"]["bytes_copied"] == 4096
              assert report["readback"]["bytes_verified"] == 4096
              assert report["readback"]["data_match"] is True
              assert report["device_lost"] is False
              assert report["cleanup"]["source_buffer_destroyed"] is True
              assert report["cleanup"]["destination_buffer_destroyed"] is True
              assert report["cleanup"]["source_memory_freed"] is True
              assert report["cleanup"]["destination_memory_freed"] is True
              assert report["cleanup"]["logical_device_destroyed"] is True
              assert report["cleanup"]["instance_destroyed"] is True
          print("R1.4 report contract is valid:", report["status"])
          PY

      - name: Verify runtime Vulkan dispatch has no direct loader dependency
        run: |
          if readelf -d build-dynamic/nyamist-cli | grep -Fq 'Shared library: [libvulkan.so]' || \
             readelf -d build-dynamic/nyamist-cli | grep -Fq 'Shared library: [libvulkan.so.1]'; then
            echo "Unexpected direct Vulkan loader dependency in DT_NEEDED"
            exit 1
          fi
          ./build-dynamic/nyamist-cli discover --output ./build-dynamic/nyamist-discovery-dynamic.json
          python3 -m json.tool ./build-dynamic/nyamist-discovery-dynamic.json > /dev/null

      - name: CLI and cache smoke tests
        run: |
          ./build/nyamist-cli advice
          ./build/nyamist-cli fingerprint "nyamist-ci-smoke-test"
          ./build/nyamist-cli demo-cache ./build/demo-cache
          ./build/nyamist-cli discover --output ./build/nyamist-discovery-ci.json
          python3 -m json.tool ./build/nyamist-discovery-ci.json > /dev/null
          ./build/nyamist-cli inspect-device configs/device-probe.example.env
          ./build/nyamist-cli inspect-panvk configs/panvk-rc5-redmi-k80-ultra.example.env
          ./build/nyamist-cli inspect-dxvk configs/dxvk-d3d11-report.template.env
          ./build/nyamist-cache-bench ./build/cache-benchmark 1 3
