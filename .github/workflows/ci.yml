name: NYAMIST Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python importer tests
        run: PYTHONPATH=tools python3 -m unittest discover -s tools/tests -v

      - name: Shell syntax check
        run: bash -n tools/termux-probe.sh tools/termux-build-core.sh tools/verify-dxvk-arm64ec.sh

      - name: Validate DXVK source lock
        run: python3 -m json.tool third_party/dxvk.lock.json > /dev/null

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNYAMIST_BUILD_TESTS=ON -DNYAMIST_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI, cache, and benchmark smoke tests
        run: |
          ./build/nyamist-cli advice
          ./build/nyamist-cli fingerprint "nyamist-ci-smoke-test"
          ./build/nyamist-cli demo-cache ./build/demo-cache
          ./build/nyamist-cli inspect-dxvk configs/dxvk-d3d11-report.template.env
          ./build/nyamist-cli inspect-vkd3d configs/vkd3d-d3d12-report.template.env
          ./build/nyamist-cache-bench ./build/cache-benchmark 1 3
