name: NYAMIST Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax check
        run: bash -n tools/termux-probe.sh tools/termux-build-core.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNYAMIST_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke test
        run: |
          ./build/nyamist-cli advice
          ./build/nyamist-cli fingerprint "nyamist-ci-smoke-test"
          ./build/nyamist-cli demo-cache ./build/demo-cache
