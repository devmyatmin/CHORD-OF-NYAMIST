name: NyaBuild Component Builds

on:
  pull_request:
    paths:
      - ".github/workflows/component-build.yml"
      - "configs/component-locks.json"
      - "tools/build-nya-panvk.sh"
      - "tools/build-nya-dxvk.sh"
      - "docs/nya-component-builds.md"
  workflow_dispatch:
    inputs:
      component:
        description: "Select which downstream components to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - panvk
          - dxvk

permissions:
  contents: read

jobs:
  validate-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate pinned component lock
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("configs/component-locks.json").read_text())
          assert lock["schemaVersion"] == 1
          c = lock["components"]
          for key in ("builderCommit", "mesaCommit"):
              assert len(c["panvk"][key]) == 40
          assert len(c["dxvk"]["builderCommit"]) == 40
          assert len(c["dxvk"]["sourceCommit"]) == 40
          assert len(c["vkd3d"]["builderCommit"]) == 40
          assert len(c["vkd3d"]["sourceCommit"]) == 40
          assert c["dxvk"]["packageRevisionFromPinnedBuilder"] == "3.1.1-4-arm64ec"
          assert c["dxvk"]["currentApkObservedPackageRevision"] == "3.1.1-5-arm64ec"
          print("NyaBuild lock validation: PASS")
          PY
      - name: Shell syntax
        run: bash -n tools/build-nya-panvk.sh tools/build-nya-dxvk.sh

  build-panvk:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'panvk'))
    needs: validate-pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NYA_BUILD_JOBS: "2"
      ANDROID_API: "35"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Mesa and Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential git curl wget unzip zip xz-utils zstd             python3 python3-pip python3-mako python3-yaml python3-ply             python3-packaging python3-jinja2 python3-jsonschema             meson ninja-build pkg-config bison flex clang llvm llvm-dev libclang-dev             libxcb1-dev libx11-dev libx11-xcb-dev libxshmfence-dev             libxcb-randr0-dev libxcb-dri3-dev libxcb-present-dev             libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev             libxcb-render0-dev libxcb-xkb-dev libxkbcommon-dev             libdrm-dev libelf-dev libexpat1-dev zlib1g-dev libzstd-dev
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install pinned Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build and statically validate NyaPANVK
        run: bash tools/build-nya-panvk.sh
      - name: Upload NyaPANVK
        uses: actions/upload-artifact@v4
        with:
          name: NyaPANVK-android-arm64
          path: dist/nya-panvk/
          if-no-files-found: error
          retention-days: 14

  build-dxvk:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'dxvk'))
    needs: validate-pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NYA_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install cross-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential git curl xz-utils zstd python3 meson ninja-build tar
      - name: Build and validate NyaDXVK and NyaVKD3D
        run: bash tools/build-nya-dxvk.sh
      - name: Upload NyaDXVK and NyaVKD3D
        uses: actions/upload-artifact@v4
        with:
          name: NyaDXVK-NyaVKD3D-arm64ec-i686
          path: dist/nya-dxvk/
          if-no-files-found: error
          retention-days: 14
